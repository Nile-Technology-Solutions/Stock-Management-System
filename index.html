<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    
    <!-- Primary Meta Tags -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="title" content="SMS Nile Tech - Stock Management System" />
    <meta name="description" content="Enterprise-grade Stock Management System for efficient inventory control, production tracking, order management, and real-time business analytics." />
    <meta name="keywords" content="stock management, inventory control, production tracking, order management, business analytics, enterprise software, SMS Nile Tech" />
    <meta name="author" content="SMS Nile Tech" />
    <meta name="robots" content="index, follow" />
    <meta name="language" content="English" />
    <meta name="revisit-after" content="7 days" />
    
    <!-- Favicon - Multiple Sizes for All Devices -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/android-chrome-192x192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/android-chrome-512x512.png" />
    
    <!-- Web App Manifest -->
    <link rel="manifest" href="/site.webmanifest" />
    
    <!-- Theme Color for Mobile Browsers -->
    <meta name="theme-color" content="#06b6d4" />
    <meta name="msapplication-TileColor" content="#06b6d4" />
    <meta name="msapplication-config" content="/browserconfig.xml" />
    
    <!-- Open Graph / Facebook Meta Tags -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://sms-niletech.com/" />
    <meta property="og:title" content="SMS Nile Tech - Stock Management System" />
    <meta property="og:description" content="Enterprise-grade Stock Management System for efficient inventory control, production tracking, and business analytics." />
    <meta property="og:image" content="/android-chrome-512x512.png" />
    <meta property="og:site_name" content="SMS Nile Tech" />
    <meta property="og:locale" content="en_US" />
    
    <!-- Twitter Card Meta Tags -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://sms-niletech.com/" />
    <meta name="twitter:title" content="SMS Nile Tech - Stock Management System" />
    <meta name="twitter:description" content="Enterprise-grade Stock Management System for efficient inventory control, production tracking, and business analytics." />
    <meta name="twitter:image" content="/android-chrome-512x512.png" />
    
    <!-- Security Headers -->
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta http-equiv="Content-Security-Policy" content="upgrade-insecure-requests" />
    
    <!-- Performance & Preconnect -->
    <link rel="dns-prefetch" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin />
    
    <!-- Page Title -->
    <title>SMS Nile Tech - Enterprise Stock Management System</title>
    
    <!-- Theme Script - Prevent Flash -->
    <script>
      // Apply theme immediately to prevent flash - default to light mode
      (function() {
        const theme = localStorage.getItem('sms_theme') || 'light';
        if (theme === 'dark') {
          document.documentElement.classList.add('dark');
        }
        // Add no-transition class to prevent transitions on page load
        document.documentElement.classList.add('no-transition');
      })();
    </script>
  </head>
  <body>
    <noscript>
      <div style="padding: 2rem; text-align: center; font-family: system-ui, -apple-system, sans-serif;">
        <h1>JavaScript Required</h1>
        <p>SMS Nile Tech Stock Management System requires JavaScript to be enabled. Please enable JavaScript in your browser settings to continue.</p>
      </div>
    </noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
